name: Publish to GitHub Pages

# Builds the app with its real data and publishes it at https://ak-gurung09.github.io/CASCADE-LENS-/
# Runs on every change to main, or by hand from the Actions tab ("Run workflow").
# The app already loads every file by a relative address, so it works under the /CASCADE-LENS-/ subpath unchanged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces a queued one but never cuts off one that is already going live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # GitHub Pages refuses a site over 1 GB. The build is about 365 MB today; stop here with a clear message if data growth ever crosses the line.
      - name: Check the site fits GitHub Pages
        run: |
          size=$(du -sm dist | cut -f1)
          echo "Built site: ${size} MB (GitHub Pages limit: 1024 MB)"
          if [ "$size" -ge 1000 ]; then echo "::error::The built site is ${size} MB, too close to the 1 GB GitHub Pages limit."; exit 1; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
